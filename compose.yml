name: ${PROJECT_NAME:-elastic}

services:
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    ports:
      - "${PHP_FPM_PORT:-9000}:9000"
    volumes:
      - ./:/app
      - ./docker/php/config/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    working_dir: /app
    environment:
      TZ: ${APP_TIMEZONE:-UTC}
    restart: unless-stopped
    networks:
      - backend

  elastic:
    build:
      context: ./docker/elastic
      dockerfile: Dockerfile
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    restart: unless-stopped
    networks:
      - backend

  kibana:
    build:
      context: ./docker/kibana
      dockerfile: Dockerfile
    depends_on:
      - elastic
    environment:
      ELASTICSEARCH_HOSTS: http://elastic:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    restart: unless-stopped
    networks:
      - backend

  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    volumes:
      - ./.Data/mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
