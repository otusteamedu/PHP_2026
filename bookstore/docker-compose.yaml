services:
  elasticsearch:
    image: elasticsearch:9.3.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - back

  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - elasticsearch
    environment:
      - ES_HOST=elasticsearch:9200
      - ES_INDEX=otus-shop
    command: tail -f /dev/null
    networks:
      - back
      
networks:
  back:
    driver: bridge