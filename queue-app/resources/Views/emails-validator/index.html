<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Email Verifier</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="./assets/css/main.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  </head>  
  <body>
    <div class="container text-center w-50 pt-3">
      <h2>Верификация списка адресов электронной почты</h2>
      <p class="fs-5 fw-semibold text-decoration-underline">
        До 10 адресов за один запрос
      </p>
      <div class="mb-3">
        <label for="report_email">Введите электронный адрес для отправки отчета</label>
        <input id="report_email" type="text" name="report_email" class="form-control" placeholder="example@mail.ru">       
      </div>
      
      <label for="emails">Вставьте список email (через запятую):</label>
      <textarea
        id="emails"
        class="form-control mt-2"
        rows="3"
        placeholder="ex1@example.ru, ex2@example.org, ex3@domain.ru"
      ></textarea>
      <div id="client-error" class="text-danger mt-2" style="display: none"></div>
      <div class="mt-2">
        <button type="button" class="btn btn-primary" id="check-btn">
          Проверить сейчас
        </button>        
      </div>
    </div>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
