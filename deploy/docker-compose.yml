services:
    gateway:
        build: haproxy
        container_name: gateway
        ports:
            - '80:80'
        volumes:
            - './haproxy/gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:r'
        networks:
            - main

    green_nginx:
        image: nginx:alpine
        container_name: greennginx
        volumes:
            - './nginx/green.conf:/etc/nginx/conf.d/default.conf:r'
            - './releases/green:/app:delegated'
        networks:
            main:
                ipv4_address: 172.20.0.10
        depends_on:
            - green
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost/up.php"]
            interval: 5s
            timeout: 10s
            retries: 3

    blue_nginx:
        image: nginx:alpine
        container_name: bluenginx
        volumes:
            - './nginx/blue.conf:/etc/nginx/conf.d/default.conf:r'
            - './releases/blue:/app:delegated'
        networks:
            main:
                ipv4_address: 172.20.0.11
        depends_on:
            - blue
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost/up.php"]
            interval: 5s
            timeout: 10s
            retries: 3

    blue:
        build: docker
        container_name: blue
        restart: unless-stopped
        environment:
            COLOR: blue
            RABBITMQ_HOST: rabbitmq
            POSTGRES_HOST: postgres
        env_file:
            - .env
        volumes:
            - ./releases/blue:/app:delegated
        working_dir: /app
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            main:
                ipv4_address: 172.20.0.20

    green:
        build: docker
        container_name: green
        restart: unless-stopped
        environment:
            COLOR: green
            RABBITMQ_HOST: rabbitmq
            POSTGRES_HOST: postgres
        env_file:
            - .env
        volumes:
            - ./releases/green:/app:delegated
        working_dir: /app
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            main:
                ipv4_address: 172.20.0.21

    blue_consumer_new:
        build: docker
        container_name: blue_consumer_new
        command: php bin/consumer_new.php
        restart: unless-stopped
        environment:
            COLOR: blue
            RABBITMQ_HOST: rabbitmq
            POSTGRES_HOST: postgres
        env_file:
            - .env
        volumes:
            - ./releases/blue:/app:delegated
        working_dir: /app
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - main

    blue_consumer_processing:
        build: docker
        container_name: blue_consumer_processing
        command: php bin/consumer_processing.php
        restart: unless-stopped
        environment:
            COLOR: blue
            RABBITMQ_HOST: rabbitmq
            POSTGRES_HOST: postgres
        env_file:
            - .env
        volumes:
            - ./releases/blue:/app:delegated
        working_dir: /app
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - main

    green_consumer_new:
        build: docker
        container_name: green_consumer_new
        command: php bin/consumer_new.php
        restart: unless-stopped
        environment:
            COLOR: green
            RABBITMQ_HOST: rabbitmq
            POSTGRES_HOST: postgres
        env_file:
            - .env
        volumes:
            - ./releases/green:/app:delegated
        working_dir: /app
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - main

    green_consumer_processing:
        build: docker
        container_name: green_consumer_processing
        command: php bin/consumer_processing.php
        restart: unless-stopped
        environment:
            COLOR: green
            RABBITMQ_HOST: rabbitmq
            POSTGRES_HOST: postgres
        env_file:
            - .env
        volumes:
            - ./releases/green:/app:delegated
        working_dir: /app
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - main

    postgres:
        image: postgres:16
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${POSTGRES_DATABASE:-hw21}
            POSTGRES_USER: ${POSTGRES_USER:-hw21}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hw21}
        volumes:
            - ./postgres_data:/var/lib/postgresql/data
            - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hw21} -d ${POSTGRES_DATABASE:-hw21}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            main:
                ipv4_address: 172.20.0.30

    rabbitmq:
        image: rabbitmq:3.13-management
        container_name: rabbitmq
        restart: always
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-user}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pass}
        ports:
            - '15672:15672'
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            main:
                ipv4_address: 172.20.0.31

networks:
    main:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/24
