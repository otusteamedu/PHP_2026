services:
  gateway:
    build: haproxy
    container_name: gateway
    ports:
      - '80:80'
    volumes:
      - './haproxy/gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:r'
    networks:
      - main

  green_nginx:
    image: nginx:alpine
    container_name: greennginx
    volumes:
      - './nginx/green.conf:/etc/nginx/conf.d/default.conf:r'
      - './releases/green:/app:delegated'
    networks:
      main:
        ipv4_address: 172.20.0.10
    depends_on:
      - green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 10s
      retries: 3

  blue_nginx:
    image: nginx:alpine
    container_name: bluenginx
    volumes:
      - './nginx/blue.conf:/etc/nginx/conf.d/default.conf:r'
      - './releases/blue:/app:delegated'
    networks:
      main:
        ipv4_address: 172.20.0.11
    depends_on:
      - blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 10s
      retries: 3

  blue:
    build:
      context: ./releases/blue
      dockerfile: docker/php-fpm/Dockerfile
    container_name: blue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - COLOR=blue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    volumes:
      - ./releases/blue:/app:delegated
    working_dir: /app
    networks:
      main:
        ipv4_address: 172.20.0.20

  green:
    build:
      context: ./releases/blue
      dockerfile: docker/php-fpm/Dockerfile
    container_name: green
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - COLOR=green
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
    volumes:
      - ./releases/green:/app:delegated
    working_dir: /app
    networks:
      main:
        ipv4_address: 172.20.0.21

  blue_consumer:
    build:
      context: ./releases/blue/docker/php-cli
    container_name: blue_consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - COLOR=blue
    volumes:
      - ./releases/blue:/app:delegated
    working_dir: /app
    command: php bin/consume.php
    depends_on:
      - rabbitmq
      - redis
    networks:
      - main

  green_consumer:
    build:
      context: ./releases/green/docker/php-cli
    container_name: green_consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - COLOR=green
    volumes:
      - ./releases/green:/app:delegated
    working_dir: /app
    command: php bin/consume.php
    depends_on:
      - rabbitmq
      - redis
    networks:
      - main

  php-cli:
    build:
      context: docker
      dockerfile: php-cli/Dockerfile
    container_name: php-cli
    volumes:
      - ./releases:/app/releases
    working_dir: /app
    profiles:
      - tools

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      main:
        ipv4_address: 172.20.0.30

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      main:
        ipv4_address: 172.20.0.31

volumes:
  redis_data:
  rabbitmq_data:

networks:
  main:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
