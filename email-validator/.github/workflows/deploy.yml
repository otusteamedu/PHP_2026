name: Production CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: [self-hosted, docker]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4    
                   
  build:
    needs: test
    runs-on: [self-hosted, docker]
    timeout-minutes: 15
    
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.set-tag.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set Image Tag
        id: set-tag  
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: true  
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ steps.set-tag.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build 
    runs-on: [self-hosted, docker]
    timeout-minutes: 20

    steps:
      - name: Checkout Infrastructure
        uses: actions/checkout@v4
        with:
          repository: Jony2Good/app-infrastructure
          path: app-infrastructure

      - name: Run Zero Downtime Deployment
        run: |       
          export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          export DEPLOY_DIR=${{ github.workspace }}/app-infrastructure
          cp /app/deploy/.env $DEPLOY_DIR/.env || echo "ВНИМАНИЕ: Файл .env не найден! Контейнеры могут не запуститься."               
          bash $DEPLOY_DIR/scripts/deploy.sh