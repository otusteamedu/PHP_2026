services:  nginx:    image: nginx:alpine    container_name: otus_first_app_nginx    restart: unless-stopped    tty: true    volumes:      - .:/var/www/otus_first_app      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf    ports:      - "8080:80"    depends_on:      - app  app:    build:      context: ./docker/php      dockerfile: Dockerfile    container_name: otus_first_app    volumes:      - .:/var/www/otus_first_app  db:    image: postgres:15    container_name: otus_first_app_postgres_db    environment:      POSTGRES_DB: highload_laravel      POSTGRES_USER: laravel      POSTGRES_PASSWORD: secret    volumes:      - otus_pgdata:/var/lib/postgresql/data    ports:      - "5432:5432"  memcached:    image: memcached:alpine    container_name: otus_first_app_memcached    ports:      - "11211:11211"  redis:    image: redis:alpine    container_name: otus_first_app_redis    ports:      - "6379:6379"volumes:  otus_pgdata: