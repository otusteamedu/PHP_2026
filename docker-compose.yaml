services:

  balancer:
    build:
      context: ./docker/balancer
    image: myapp/balancer # имя будущего образа
    container_name: "${CONTAINER_BALANCER}" # имя контейнера после запуска
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
       - ./:/app
    depends_on:
      - nginx1
      - nginx2

  nginx1:
    build:
      context: ./docker/nginx
    image: myapp/nginx # имя будущего образа
    container_name: "${CONTAINER_NGINX}1" # имя контейнера после запуска
    environment:
      PHP_FPM_UPSTREAM: app1
    volumes:
      - ./:/app
    depends_on:
      - app1

  nginx2:
    build:
      context: ./docker/nginx
    image: myapp/nginx # имя будущего образа
    container_name: "${CONTAINER_NGINX}2" # имя контейнера после запуска
    environment:
      PHP_FPM_UPSTREAM: app2
    volumes:
      - ./:/app
    depends_on:
      - app2

  app1:
    build:
      context: ./docker/fpm
    image: myapp/php
    container_name: "${CONTAINER_APP}1"
    env_file:
      - .env
    volumes:
       - ./:/app
    depends_on:
      - redis

  app2:
    build:
      context: ./docker/fpm
    image: myapp/php
    container_name: "${CONTAINER_APP}2"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - redis

  redis:
    image: redis
    container_name: "${CONTAINER_REDIS}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
