services:
  nginx:
    build:
      context: ./docker/nginx_balanser
      dockerfile: Dockerfile
    image: balancer/nginx
    container_name: nginx_balancer
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - nginx1
      - nginx2

  nginx1:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: nginx1
    container_name: nginx1
    volumes:
      - .:/var/www/html
    expose:
      - "81"
    networks:
      - app-network
    depends_on:
      - app1
      - app2

  nginx2:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: nginx2
    container_name: nginx2
    volumes:
      - .:/var/www/html
    expose:
      - "81"
    networks:
      - app-network
    depends_on:
      - app1
      - app2

  app1:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: php1
    container_name: app1
    volumes:
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - redis

  app2:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: php2
    container_name: app2
    volumes:
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - redis

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    volumes:
      - /var/www/redis:/data/redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis-data: