services:
  nginx:
    image: nginx:alpine
    container_name: otus_four_app_nginx
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www/otus_four_app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
      - app_1
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: otus_four_app
    volumes:
      - .:/var/www/otus_four_app
    depends_on:
      - redis
  app_1:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: otus_four_app_2
    volumes:
      - .:/var/www/otus_four_app
    depends_on:
      - redis
  redis:
    image: redis:alpine
    container_name: otus_four_app_redis
volumes:
  otus_four_app:
