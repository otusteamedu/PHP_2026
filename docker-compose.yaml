services:
  nginx:
    image: nginx:alpine
    container_name: otus_five_app_nginx
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www/otus_five_app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: otus_five_app
    volumes:
      - .:/var/www/otus_five_app
volumes:
  otus_five_app: