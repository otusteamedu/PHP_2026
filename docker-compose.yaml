services:
  nginx:
    build:
      context: ./nginx_balanser
      dockerfile: Dockerfile
    image: balance/nginx
    container_name: nginx_balance
    # проброс портов
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - nginx1
      - nginx2

  nginx1:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: next/nginx
    container_name: nginx1
    volumes:
      - ./code:/var/www/html
    expose:
      - "81"
    networks:
      - app-network
    depends_on:
      - app1
      - app2

  nginx2:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: next/nginx
    container_name: nginx2
    volumes:
      - ./code:/var/www/html
    expose:
      - "81"
    networks:
      - app-network
    depends_on:
      - app1
      - app2

  app1:
    build:
      context: ./php
      dockerfile: Dockerfile
    image: balance/php
    container_name: app1
    volumes:
      - ./code:/var/www/html
    networks:
      - app-network
    depends_on:
      - redis

  app2:
    build:
      context: ./php
      dockerfile: Dockerfile
    image: balance/php
    container_name: app2
    volumes:
      - ./code:/var/www/html
    networks:
      - app-network
    depends_on:
      - redis

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    image: myapp/redis
    container_name: redis
    volumes:
      - /var/www/redis:/data/redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge