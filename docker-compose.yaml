services:

  balancer:
    build:
      context: ./docker/balancer
    image: myapp/balancer # имя будущего образа
    container_name: "${CONTAINER_BALANCER}" # имя контейнера после запуска
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
       - ./:/app
    depends_on:
      - nginx1
      - nginx2

  nginx1:
    build:
      context: ./docker/nginx
    image: myapp/nginx # имя будущего образа
    container_name: "${CONTAINER_NGINX}1" # имя контейнера после запуска
    volumes:
      - ./:/app
    depends_on:
      - app1
      - app2

  nginx2:
    build:
      context: ./docker/nginx
    image: myapp/nginx # имя будущего образа
    container_name: "${CONTAINER_NGINX}2" # имя контейнера после запуска
    volumes:
      - ./:/app
    depends_on:
      - app1
      - app2

  app1:
    build:
      context: ./docker/fpm
    image: myapp/php
    container_name: "${CONTAINER_APP}1"
    env_file:
      - .env
    volumes:
       - ./:/app
    depends_on:
      - redis-cluster-init

  app2:
    build:
      context: ./docker/fpm
    image: myapp/php
    container_name: "${CONTAINER_APP}2"
    env_file:
      - .env
    volumes:
      - ./:/app
    depends_on:
      - redis-cluster-init

  redis-node-1:
    image: redis:latest
    command: redis-server /redis/redis.conf
    volumes:
      - redis-node-1-data:/data
      - ./docker/redis:/redis

  redis-node-2:
    image: redis:latest
    command: redis-server /redis/redis.conf
    volumes:
      - redis-node-2-data:/data
      - ./docker/redis:/redis

  redis-node-3:
    image: redis:latest
    command: redis-server /redis/redis.conf
    volumes:
      - redis-node-3-data:/data
      - ./docker/redis:/redis

  redis-node-4:
    image: redis:latest
    command: redis-server /redis/redis.conf
    volumes:
      - redis-node-4-data:/data
      - ./docker/redis:/redis

  redis-node-5:
    image: redis:latest
    command: redis-server /redis/redis.conf
    volumes:
      - redis-node-5-data:/data
      - ./docker/redis:/redis

  redis-node-6:
    image: redis:latest
    command: redis-server /redis/redis.conf
    volumes:
      - redis-node-6-data:/data
      - ./docker/redis:/redis

  redis-cluster-init:
    image: redis:latest
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    command: "redis-cli --cluster create redis-node-1:7000 redis-node-2:7000 redis-node-3:7000 redis-node-4:7000 redis-node-5:7000 redis-node-6:7000 --cluster-replicas 1 --cluster-yes"

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
