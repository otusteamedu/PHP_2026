services:
  nginx:
    image: nginx:alpine
    container_name: otus_first_app_nginx
    restart: unless-stopped
    tty: true
    volumes:
      - .:/var/www/otus_first_app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: otus_first_app
    volumes:
      - .:/var/www/otus_first_app

  db:
    image: postgres:15
    container_name: otus_first_app_postgres_db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - otus_pgdata:/var/lib/postgresql/data
  memcached:
    image: memcached:alpine
    container_name: otus_first_app_memcached
  redis:
    image: redis:alpine
    container_name: otus_first_app_redis
volumes:
  otus_pgdata:
