services:
  # Точка входа (Балансировщик)
  lb:
    image: nginx:1.27.3-alpine
    container_name: bitrix_lb
    ports:
      - "192.168.56.101:80:80" # Привязываем порт 80 контейнера к IP виртуалки
    volumes:
      - ./nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend_net
    # ВАЖНО: Только Nginx LB имеет право быть доступным внутри VM. 
    # Но мы НЕ используем ports. Доступ идет через IP виртуалки.
    depends_on:
      - php
    expose:
      - "80"

  # Бэкенд-узлы (App Cluster)
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    deploy:
      replicas: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./:/var/www/html:delegated
    command: >
      sh -c "sleep 5 composer install --no-interaction --optimize-autoloader && php-fpm"
    networks:
      - backend_net
    depends_on:
      - redis-1
      - redis-2
      - redis-3

  # Узлы Redis Cluster
  redis-1:
    image: redis:7.4.2-alpine
    container_name: redis-1
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
    networks:
      - backend_net

  redis-2:
    image: redis:7.4.2-alpine
    container_name: redis-2
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
    networks:
      - backend_net

  redis-3:
    image: redis:7.4.2-alpine
    container_name: redis-3
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
    networks:
      - backend_net

  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - backend_net
    volumes:
      - ./mysql_data:/var/lib/mysql

networks:
  backend_net:
    driver: bridge
