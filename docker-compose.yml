networks:
  bookstore_net:
    driver: bridge

services:
  # Web-server: Angie (High-End Proxy)
  angie:
    image: docker.angie.software/angie:1.11.3
    container_name: evgeny87-angie
    ports:
      - "80:80"
    volumes:
      - ./conf/angie.conf:/etc/angie/http.d/default.conf:ro
      - ./src:/var/www/html:ro
      - php_socket:/var/run/php
    networks:
      - bookstore_net
    depends_on:
      - php
    restart: always

  # Backend: PHP 8.4.18 Titan
  php:
    image: php:8.4.18-fpm-alpine
    container_name: evgeny87-php
    volumes:
      - ./src:/var/www/html:delegated
      - php_socket:/var/run/php
    networks:
      - bookstore_net
    depends_on:
      - elasticsearch
    restart: always

  # Search: Elasticsearch
  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: evgeny87-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - bookstore_net
    restart: always

  # UI: Kibana
  kibana:
    image: kibana:8.17.0
    container_name: evgeny87-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - bookstore_net
    depends_on:
      - elasticsearch
    restart: always

volumes:
  php_socket:
