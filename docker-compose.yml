services:
  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: ./php
    volumes:
      - ./src:/var/www/html:delegated
    expose:
      - "9000"
    environment:
      REDIS_HOST: redis
      MEMCACHED_HOST: memcached
      DB_HOST: db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  memcached:
    image: memcached:alpine
    ports:
      - "11211:11211"

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - ./data/db:/var/lib/mysql

networks:
  default:
    name: php_hw1_network
