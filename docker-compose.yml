services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DATABASE_URL: "postgresql://user:user@database:5432/app?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://user:user@rabbitmq:5672/%2f/messages"
      APP_ENV: dev
    volumes:
      - .:/var/www/app
      - /var/www/app/vendor
      - /var/www/app/var
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/app:ro
    depends_on:
      - php

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php bin/console messenger:consume async -vv
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://user:user@database:5432/app?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://user:user@rabbitmq:5672/%2f/messages"
      APP_ENV: dev
    volumes:
      - .:/var/www/app
      - /var/www/app/vendor
      - /var/www/app/var
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "user"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  database_data: