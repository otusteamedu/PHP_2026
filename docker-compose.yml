services:
  elasticsearch:
    container_name: hw10-elasticsearch
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - bookstore

  app:
    container_name: hw10-php
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - elasticsearch
    environment:
      - ES_HOST=${ES_HOST}
      - ES_INDEX=${ES_INDEX}
    stdin_open: true
    tty: true
    networks:
      - bookstore

  kibana:
    image: kibana:8.13.0
    container_name: hw10-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: always
    networks:
      - bookstore
networks:
  bookstore:
    driver: bridge
