services:
  php-cli:
    build:
      context: ./docker
      dockerfile: Dockerfile
    depends_on: ["postgres"]
    volumes:
      - ./:/app

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mapper
    volumes:
      - postgres:/var/lib/postgresql
      - ./:/app
    ports:
      - "5432:5432"

volumes:
  postgres:
