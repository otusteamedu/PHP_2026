<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <style>
        body {
            max-width: 80rem;      /* max-w-7xl = 1280px */
            margin-left: auto;      /* mx-auto */
            margin-right: auto;     /* mx-auto */
            padding: 2rem;          /* p-8 (2rem = 32px) */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        h1 {
            font-size: 1.875rem;    /* text-3xl = 30px */
            line-height: 2.25rem;    /* text-3xl line-height */
            font-weight: 700;        /* font-bold */
            text-decoration: underline; /* underline */
            color: #2563eb;          /* text-blue-600 */
            text-align: center;
        }

        p {
            margin-top: 1rem;        /* mt-4 = 16px */
            color: #374151;          /* text-gray-700 */
        }
    </style>
<body class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold underline">
        Hello Balancer!
    </h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. A assumenda, debitis eveniet facilis fuga fugit ipsam iusto non optio qui repudiandae temporibus vel voluptate? Animi aperiam aut nemo obcaecati possimus?</p>
</body>
</html>
