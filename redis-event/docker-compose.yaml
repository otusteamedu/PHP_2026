services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_app
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - redis
    networks:
      - app_net
    tty: true
    stdin_open: true
    command: tail -f /dev/null

  redis:
    image: redis:7-alpine
    container_name: event_redis
    ports:
      - "6379:6379"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge