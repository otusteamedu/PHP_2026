; Minimal local overrides for PHP CLI app

date.timezone = UTC
memory_limit = 512M
max_execution_time = 120
default_socket_timeout = 60

; Keep error visibility in local development
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Useful for dependency-heavy CLI commands
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Enable OPcache and CLI acceleration for repeated commands
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
