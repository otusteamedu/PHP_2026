; Use Redis as session handler
session.save_handler = redis

; Connection string format: tcp://host:port?options
; Basic connection:
;session.save_path = "tcp://redis-server-ip:6379"

; With authentication and persistent connection:
session.save_path = "tcp://redis:6379?timeout=2&read_timeout=2&persistent=1&auth=oasjw44wcsnjd&database=0"

; Session name (this deactivates sticky sessions)
session.name = PHPSESSID

; Session lifetime (in seconds)
session.gc_maxlifetime = 7200

; Cookie settings for security
session.cookie_httponly = 1
; For local HTTP testing behind the balancer, do not mark
; the cookie as "Secure", otherwise the browser will ignore it
; on http:// requests and the session will not persist.
; Set this back to 1 when you terminate TLS in front of nginx.
session.cookie_secure = 0
session.cookie_samesite = "Lax"
