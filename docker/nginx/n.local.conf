upstream php-instance {
    least_conn;
    server app1:9000;
    server app2:9000;
}

server {
    listen 80;

    server_name balancer.local;

    # Корневая директория
    root /var/www/html;
    # Стартовый файл
    index index.php index.html;

    # Обработка статики происходит без логов и FPM
    # http://balancer.local/***/some.jpg
    location ~* .(jpg|jpeg|gif|css|png|js|ico|html)$ {
        access_log off;
        expires max;
    }

    # Единая точка доступа
    # Все запросы заворачиваются в корневую директорию root на index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Правило обращения к FPM
    location ~* .php$ {
        try_files $uri = 404;
        fastcgi_split_path_info ^(.+.php)(/.+)$;
        fastcgi_pass php-instance;
        # fastcgi_pass app:9000; # app - название php сервиса в docker-compose.yaml 9000 - standard port
        fastcgi_index index.php;
        include fastcgi_params;
        # fastcgi_pass unix:/var/run/php-fpm.sock; # При работе с сокетами
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    error_log /var/log/nginx/local_error.log debug;
    access_log /var/log/nginx/local_access.log;
}
