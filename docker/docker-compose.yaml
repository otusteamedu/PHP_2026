services:

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: myapp/nginx # имя будущего образа
    container_name: "${CONTAINER_NGINX}" # имя контейнера после запуска
    ports:
      - "${NGINX_PORT:-80}:80"
    #Для маршрутизации nginx нужен контекст проекта + доступ к сокету через docker volume
    volumes:
       - ./code:/data/mysite.local
       - php-socket:/var/run
    depends_on:
      - app

  app:
    build:
      context: fpm
      dockerfile: Dockerfile
    image: myapp/php
    container_name: "${CONTAINER_APP}"
    volumes:
       - ./code:/data/mysite.local
       - php-socket:/var/run

  redis:
    image: redis
    container_name: "${CONTAINER_REDIS}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    depends_on:
      - app

  memcached:
    image: memcached
    container_name: "${CONTAINER_MEMCACHED}"
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    depends_on:
      - app

  db:
      image: postgres
      container_name: "${CONTAINER_DB}"
      environment:
        POSTGRES_USER: "${DB_USERNAME}"
        POSTGRES_PASSWORD: "${DB_PASSWORD}"
        POSTGRES_DB: "${DB_NAME}"
      volumes:
        - postgres:/var/lib/postgresql
      ports:
        - "${DB_PORT:-5432}:5432"

volumes:
  postgres:
  php-socket:
