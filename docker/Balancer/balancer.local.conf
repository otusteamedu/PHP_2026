upstream app{
    least_conn;
    server nginx1:80;
    server nginx2:80;
}

# Этот сервер принимает весь трафик на порт 80 и передает его вышестоящему потоку.
# Обратите внимание, что имя вышестоящего потока и proxy_pass должны совпадать.

server {
    # Порт для соединения внутри контейнера
    listen 80;


    # Какому доменному имени принадлежит конфиг
    # Далее нужно добавить это в /etc.hosts
    # 127.0.0.1 balancer.local
    #       ::1 balancer.local
    server_name balancer.local;

    location / {
        proxy_pass http://app;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

